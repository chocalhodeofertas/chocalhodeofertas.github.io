name: Inspecionar categorias do ML
on:
  workflow_dispatch:
    inputs:
      script:
        default: inspecionar_categorias
      args:
        default: ""
permissions:
  contents: write
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -m tools.${{ inputs.script || 'inspecionar_categorias' }} "${{ inputs.args }}"
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      - name: Publica saida/ num branch temporário
        if: always()
        run: |
          [ -d saida ] || exit 0
          cd saida
          git init -q -b tmp-saida
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "saida ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-saida

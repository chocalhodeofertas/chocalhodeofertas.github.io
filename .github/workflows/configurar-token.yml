name: Configurar token do Mercado Livre

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Cole aqui o endereço inteiro (ou só o código depois de code=) que apareceu após autorizar"
        required: true
      redirect_uri:
        description: "O mesmo Redirect URI cadastrado no app do Mercado Livre"
        required: true
        default: "https://github.com/lgabanella/bot-ofertas"

permissions:
  contents: write

concurrency:
  group: chocalho-bot
  cancel-in-progress: false

jobs:
  configurar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Trocar código por token
        run: python -m bot.configurar_token
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          CODIGO: ${{ inputs.codigo }}
          REDIRECT_URI: ${{ inputs.redirect_uri }}
      - name: Salvar token criptografado
        run: |
          git config user.name "chocalho-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/token_ml.enc
          git commit -m "Token do Mercado Livre configurado [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

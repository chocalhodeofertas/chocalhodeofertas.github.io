name: Chocalho de Ofertas (ciclo)

# Fica rodando sem parar: cada execução dura ~5h30, faz uma rodada a cada
# 20 min no horário de postagem e, ao terminar, dispara a próxima.
# Para PARAR o bot: Actions → este workflow → ⋯ → Disable workflow.
# Para LIGAR de novo: Enable workflow e depois Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: chocalho-ciclo
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar em ciclo
        run: |
          git config user.name "chocalho-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m bot.ciclo --horas 5.5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || '787296152' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          MIN_DESCONTO: ${{ vars.MIN_DESCONTO || '20' }}
          MAX_POSTS_POR_RODADA: ${{ vars.MAX_POSTS_POR_RODADA || '2' }}
          MAX_POSTS_POR_HORA: ${{ vars.MAX_POSTS_POR_HORA || '4' }}
          MAX_POSTS_POR_DIA: ${{ vars.MAX_POSTS_POR_DIA || '50' }}
          HORA_INICIO: ${{ vars.HORA_INICIO }}
          HORA_FIM: ${{ vars.HORA_FIM }}
          POR_CATEGORIA: ${{ vars.POR_CATEGORIA }}
          LINK_MODO: ${{ vars.LINK_MODO }}
          LOTE_TAMANHO: ${{ vars.LOTE_TAMANHO }}
          LOTES_POR_DIA: ${{ vars.LOTES_POR_DIA }}
          INTERVALO_MIN: ${{ vars.INTERVALO_MIN }}
          INTERVALO_MAX: ${{ vars.INTERVALO_MAX }}
          ATRASO_MAX: ${{ vars.ATRASO_MAX }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CANAL_CUPONS: ${{ secrets.TG_CANAL_CUPONS }}
          CUPONS_CATEGORIAS: ${{ vars.CUPONS_CATEGORIAS }}
          WHATSAPP_GRUPO: ${{ vars.WHATSAPP_GRUPO || 'https://chat.whatsapp.com/FOwEWWIjfKoFWmD8Xsv5lq' }}
          AFILIADO_MATT_WORD: ${{ vars.AFILIADO_MATT_WORD || 'chocalhodeofertas' }}
          AFILIADO_MATT_TOOL: ${{ vars.AFILIADO_MATT_TOOL || '39326742' }}

      - name: Disparar a próxima execução
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ciclo.yml --ref "${GITHUB_REF_NAME}"

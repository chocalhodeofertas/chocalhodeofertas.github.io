name: Chocalho de Ofertas

on:
  schedule:
    # A cada 20 min, das 8h às 21h47 (horário de Brasília; o cron é em UTC)
    # O GitHub às vezes pula rodadas agendadas; rodar mais vezes compensa,
    # e o próprio bot limita a 2 posts por hora.
    - cron: "7,27,47 11-23,0 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = manda só pra você · diagnostico = confere a configuração · normal = posta no canal"
        type: choice
        default: diagnostico
        options: [diagnostico, teste, normal]

permissions:
  contents: write

concurrency:
  group: chocalho-bot
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar o bot
        run: python -m bot.main --modo "${{ inputs.modo || 'normal' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID || '787296152' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          MIN_DESCONTO: ${{ vars.MIN_DESCONTO || '20' }}
          MAX_POSTS_POR_RODADA: ${{ vars.MAX_POSTS_POR_RODADA || '2' }}
          MAX_POSTS_POR_HORA: ${{ vars.MAX_POSTS_POR_HORA || '4' }}
          MAX_POSTS_POR_DIA: ${{ vars.MAX_POSTS_POR_DIA || '50' }}
          HORA_INICIO: ${{ vars.HORA_INICIO }}
          HORA_FIM: ${{ vars.HORA_FIM }}
          POR_CATEGORIA: ${{ vars.POR_CATEGORIA }}
          AFILIADO_MATT_WORD: ${{ vars.AFILIADO_MATT_WORD || 'chocalhodeofertas' }}
          AFILIADO_MATT_TOOL: ${{ vars.AFILIADO_MATT_TOOL || '39326742' }}

      - name: Salvar histórico de preços
        if: always()
        run: |
          git config user.name "chocalho-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado.json data/token_ml.enc 2>/dev/null || git add data/estado.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza histórico de preços [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
